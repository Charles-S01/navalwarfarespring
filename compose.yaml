services:
  server:
    build:
      context: .
    ports:
      - 8080:8080
    env_file:
      - .env
    # environment:
    # # Overrides the localhost URL from .env; the DB is reachable by its service name.
    # DATABASE_URL: ${DATABASE_URL}
    # # Allowed CORS origin; set ORIGIN_URL in .env to override.
    # ORIGIN_URL: ${ORIGIN_URL:-http://localhost:5173}
    # # Use only for an initial disposable deployment; switch to migrations before keeping real data.
    # SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: navalwarfare_db
      # Interpolated from .env by Docker Compose.
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
